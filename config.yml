# ============================================================
#  KryosMascotas - Mascotas pequeñas que se compran, luchan a tu
#  lado, suben de nivel, se montan y se usan de sombrero.
#  Formato de textos: MiniMessage
# ============================================================

prefijo: "<gradient:#ff5555:#ffaa00><bold>KRYOS</bold></gradient> <dark_gray>»</dark_gray> "
moneda: "$"                    # símbolo que se muestra en los precios (usa Vault)
invocar-al-entrar: true        # vuelve a invocar la última mascota activa al entrar
autoguardado-minutos: 5
maximo-nivel: 50

# true  = cada mascota da las recompensas de nivel por separado
# false = cada recompensa de nivel se cobra una sola vez por jugador
recompensas-por-mascota: true

# Menús (%pagina% %paginas% %mascota% se reemplazan solos)
menu:
  titulo-general: "<gradient:#ffaa00:#ff5555><bold>Mascotas</bold></gradient> <dark_gray>(%pagina%/%paginas%)"
  titulo-niveles: "%mascota% <dark_gray>- Niveles (%pagina%/%paginas%)"
  titulo-mascota: "%mascota% <dark_gray>- Menú"
  titulo-acciones: "%mascota% <dark_gray>- Acciones"
  titulo-cosmeticos: "%mascota% <dark_gray>- Cosméticos"
  titulo-opcion: "<gradient:#ffaa00:#ff5555><bold>%mascota%"
  titulo-confirmar: "<gradient:#ffaa00:#ff5555><bold>Confirmar compra"
  relleno: BLACK_STAINED_GLASS_PANE
  borde: ORANGE_STAINED_GLASS_PANE
  nivel-desbloqueado: LIME_STAINED_GLASS_PANE
  nivel-progreso: YELLOW_STAINED_GLASS_PANE
  nivel-bloqueado: RED_STAINED_GLASS_PANE

# XP necesaria para subir de nivel = base + (nivel actual * por-nivel)
xp:
  base: 50
  por-nivel: 30
  por-matar-hostil: 10
  por-matar-pasivo: 2
  por-matar-jugador: 25
  por-matar-jefe: 500
  bonus-ataque-mascota: 5      # extra si la mascota ayudó a matar
  multiplicador-global: 1.0    # súbelo en eventos de XP doble

mascota:
  velocidad: 1.3
  distancia-seguir: 3.0
  distancia-teletransporte: 20
  rango-ataque: 12
  auto-defender: true          # ataca monstruos cercanos sin que le golpees
  rango-defensa: 8
  enfriamiento-ataque: 1.0     # segundos entre golpes (mínimo 0.5)
  atacar-jugadores: false
  bonus-danio-por-nivel: 1.5   # % extra de daño por nivel (0 = daño fijo)

# Nivel al que se desbloquea cada función (1 = desde el principio)
sombrero:
  nivel: 1                   # 1 = disponible desde el principio
montar:
  nivel: 1                   # 1 = disponible desde el principio
  velocidad: 0.22              # velocidad al montar (bloques por tick)
  escala: 2.0                  # tamaño de la mascota mientras la montas (1.0 = sin cambio)

acariciar:
  xp: 15
  enfriamiento-minutos: 30

# ------------------------------------------------------------
#  RECOMPENSAS POR NIVEL
#  Opciones: descripcion (se ve en el menú), mensaje, comandos,
#            solo-mascota
#  Variables en comandos: %player% %pet% %level%
#  Cambia los comandos por dinero (eco give %player% 500),
#  cajas, rangos, ítems de otros plugins, etc.
# ------------------------------------------------------------
recompensas:
  2:
    descripcion: "1 manzana dorada"
    mensaje: "<green>Tu mascota encontró <gold>1 manzana dorada<green>."
    comandos:
      - "give %player% minecraft:golden_apple 1"
  3:
    descripcion: "3 diamantes"
    mensaje: "<green>Tu mascota desenterró <aqua>3 diamantes<green>."
    comandos:
      - "give %player% minecraft:diamond 3"
  5:
    descripcion: "3 niveles de experiencia"
    comandos:
      - "experience add %player% 3 levels"
  7:
    descripcion: "16 botellas de experiencia"
    comandos:
      - "give %player% minecraft:experience_bottle 16"
  10:
    descripcion: "8 diamantes"
    mensaje: "<aqua>¡Nivel 10! Tu mascota te trae un regalo."
    comandos:
      - "give %player% minecraft:diamond 8"
  12:
    descripcion: "5 niveles de experiencia"
    comandos:
      - "experience add %player% 5 levels"
  15:
    descripcion: "Tótem de la inmortalidad"
    mensaje: "<gold>Tu mascota te regala un <white>tótem<gold>."
    comandos:
      - "give %player% minecraft:totem_of_undying 1"
  18:
    descripcion: "2 manzanas encantadas"
    comandos:
      - "give %player% minecraft:enchanted_golden_apple 2"
  20:
    descripcion: "4 fragmentos de netherita"
    comandos:
      - "give %player% minecraft:netherite_scrap 4"
  25:
    descripcion: "Espada de diamante (solo Lobo)"
    solo-mascota: lobo
    mensaje: "<gray>El lobo te trae una espada de diamante."
    comandos:
      - "give %player% minecraft:diamond_sword 1"
  30:
    descripcion: "2 lingotes de netherita"
    comandos:
      - "give %player% minecraft:netherite_ingot 2"
  35:
    descripcion: "10 niveles de experiencia"
    comandos:
      - "experience add %player% 10 levels"
  40:
    descripcion: "4 lingotes de netherita"
    comandos:
      - "give %player% minecraft:netherite_ingot 4"
  45:
    descripcion: "Bloque de netherita"
    comandos:
      - "give %player% minecraft:netherite_block 1"
  50:
    descripcion: "Anuncio global + 5 manzanas encantadas"
    mensaje: "<gold><bold>¡NIVEL MÁXIMO!</bold> <yellow>Tu mascota es una leyenda."
    comandos:
      - "give %player% minecraft:enchanted_golden_apple 5"
      - 'tellraw @a {"text":"¡%player% llevó a su mascota al nivel máximo!","color":"gold"}'

# ------------------------------------------------------------
#  MASCOTAS (todas pequeñas, se compran con dinero de Vault)
#  entidad:     mob de Bukkit (EntityType)
#  icono:       material del menú
#  precio:      0 = gratis. por-defecto: true = todos la tienen
#  danio-base:  daño por golpe
#  crianza:     OPCIONAL (bebé o adulta a elección, gratis)
#               SIEMPRE  (siempre bebé, para que sea pequeña)
#               NINGUNA  (sin edad)
#  velocidad:   (opcional) multiplicador de velocidad al seguirte
#  efectos:     "EFECTO:amplificador:nivel" (se aplican al dueño)
#  estela:      partículas que se desbloquean por nivel
# ------------------------------------------------------------
